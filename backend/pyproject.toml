[project]
name = "roompilot-backend"
version = "0.1.0"
description = "RoomPilot 3-agent LangGraph backend (민지 시나리오)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # 한국어 주석/프롬프트는 길이 제한 예외

[tool.mypy]
python_version = "3.11"
files = ["app", "tests", "demo.py", "chat.py", "scripts"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true   # langgraph / langchain_upstage / sse_starlette 스텁 없음
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_incomplete_defs = true
